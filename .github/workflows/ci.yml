name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two Node.js lines the package supports (`engines`), as in core and dsl-jsonlogic.
        node-version: [20, 24]
    name: ci (Node ${{ matrix.node-version }})
    env:
      # Reads the private @run-iq packages (org secret: classic PAT, read:packages).
      NODE_AUTH_TOKEN: ${{ secrets.RUN_IQ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@run-iq'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Built before the tests: the tests of the built entries need dist and fail without it.
      - run: npm run build
      - run: npm test
      # The scale limits, one file at a time (minutes, gigabytes), after the fast suite.
      - run: npm run test:heavy
